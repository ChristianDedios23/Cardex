name: CI/CD

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: Backend

jobs:
    ci:
        name: Lint & Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: Backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Typecheck
              run: npm run typecheck

    validate-docker:
        name: Validate Docker Compose
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: .
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Validate compose file
              run: docker compose config --quiet

    deploy:
        name: Deploy
        needs: [ci, validate-docker]
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: Backend/package-lock.json

            - name: Install production dependencies
              working-directory: Backend
              run: npm ci --omit=dev

            - name: Upload backend artifact
              uses: actions/upload-artifact@v4
              with:
                  name: backend-${{ github.sha }}
                  path: |
                      Backend/src
                      Backend/openapi.yaml
                      Backend/package.json
                      Backend/package-lock.json
                      Backend/tsconfig.json
                  retention-days: 30

            # Add deployment steps for your hosting provider below.
            # Examples: Railway, Fly.io, AWS, Azure, or a self-hosted runner.
            - name: Deploy placeholder
              run: echo "CI passed. Configure deployment for your environment in .github/workflows/ci.yml"
