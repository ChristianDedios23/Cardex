services:
  postgres:
    image: postgres:17-alpine
    container_name: cardex-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cardex
      POSTGRES_PASSWORD: cardex
      POSTGRES_DB: cardex
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardex -d cardex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
